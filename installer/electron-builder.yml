appId: com.sandblockstudios.gimnastika
productName: Gimnastika
executableName: GimnastikaDesktop
directories:
  output: release
  buildResources: installer
files:
  - dist/**
  - electron/**
  - package.json
  # pdfjs-dist (uvoz PDF prijava): treba samo legacy/build/pdf.mjs i pdf.worker.mjs za citanje teksta;
  # prikaz strana (fontovi, slike, canvas) se ne koristi
  - "!node_modules/pdfjs-dist/{build,web,types,image_decoders,cmaps,standard_fonts,iccs,wasm}/**"
  - "!node_modules/pdfjs-dist/legacy/{web,image_decoders}/**"
  - "!node_modules/pdfjs-dist/**/*.{map,d.mts}"
  - "!node_modules/pdfjs-dist/legacy/build/{pdf.min.mjs,pdf.worker.min.mjs,pdf.sandbox.mjs,pdf.sandbox.min.mjs}"
  - "!node_modules/@napi-rs/**"
# pdfjs se ucitava kao ES modul (import), pa je raspakovan pored app.asar (vidi electron/uvoz/pdf.cjs)
asarUnpack:
  - node_modules/pdfjs-dist/**
win:
  target:
    - target: nsis
      arch: x64
  icon: installer/ikona.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Gimnastika-Setup-${version}.exe
  shortcutName: Gimnastika desktop
  include: installer/installer.nsh
  uninstallDisplayName: "Gimnastika desktop ${version}"
publish:
  - provider: github
    owner: bojand1111
    repo: gimnastika
